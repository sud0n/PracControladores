<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Licencias de software</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/License.js" defer></script>
    <script src="js/LicenseController.js" defer></script>
    <script src="js/App.js" defer></script>
</head>
<body>
    <main>
        <h1>Licencias de software</h1>

        <section class="catalog-section" aria-labelledby="featured-title">
            <h2 id="featured-title">Destacados</h2>
            <div class="license-grid" id="featured"></div>
        </section>

        <section class="catalog-section" aria-labelledby="offers-title">
            <h2 id="offers-title">Ofertas</h2>
            <div class="license-grid" id="offers"></div>
        </section>

        <section class="catalog-section" aria-labelledby="latest-title">
            <h2 id="latest-title">Novedades</h2>
            <div class="license-grid" id="latest"></div>
        </section>

        <section class="catalog-section" aria-labelledby="all-title">
            <h2 id="all-title">Todas las licencias</h2>
            <div class="license-grid" id="all"></div>
        </section>
    </main>
</body>
</html>
